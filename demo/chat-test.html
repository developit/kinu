<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Demo Test</title>
    <link rel="stylesheet" href="src/style.css">
    <style>
        /* Add some basic reset styles for the test */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: system-ui, sans-serif;
            background: #f8fafc;
        }
        
        /* Mock the demo header styles */
        .demo-header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: white;
            border-bottom: 1px solid #e2e8f0;
            padding: 1rem;
            z-index: 100;
        }
        
        .home-nav {
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        
        .home-nav a {
            color: #475569;
            text-decoration: none;
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            transition: background-color 0.2s;
        }
        
        .home-nav a:hover {
            background: #f1f5f9;
        }
        
        .home-nav a.active {
            background: #3b82f6;
            color: white;
        }
    </style>
</head>
<body>
    <!-- Mock Global Header -->
    <nav class="demo-header home-nav">
        <a href="#" class="active">Home</a>
        <a href="#">Components</a>
        <a href="#">Linear Demo</a>
        <a href="#" class="active">Chat Demo</a>
        <a href="#">Music Demo</a>
    </nav>

    <!-- Chat Interface -->
    <div class="chat-container">
        <div class="chat-window">
            <!-- Chat Header -->
            <div class="chat-header">
                <div class="chat-contact">
                    <div class="chat-avatar">SD</div>
                    <div class="contact-info">
                        <h3 class="contact-name">Sofia Davis</h3>
                        <p class="contact-email">m@example.com</p>
                    </div>
                </div>
                <button class="chat-attachment-btn">
                    <span class="attachment-icon">+</span>
                </button>
            </div>

            <!-- Chat Messages -->
            <div class="chat-messages">
                <div class="chat-message incoming">
                    <div class="message-bubble">
                        <p class="message-text">Hi, how can I help you today?</p>
                        <span class="message-time">2:30 PM</span>
                    </div>
                </div>
                
                <div class="chat-message outgoing">
                    <div class="message-bubble">
                        <p class="message-text">Hey, I'm having trouble with my account.</p>
                        <span class="message-time">2:31 PM</span>
                    </div>
                </div>
                
                <div class="chat-message incoming">
                    <div class="message-bubble">
                        <p class="message-text">What seems to be the problem?</p>
                        <span class="message-time">2:32 PM</span>
                    </div>
                </div>
                
                <div class="chat-message outgoing">
                    <div class="message-bubble">
                        <p class="message-text">I can't log in.</p>
                        <span class="message-time">2:33 PM</span>
                    </div>
                </div>
            </div>

            <!-- Message Input -->
            <div class="chat-input-container">
                <input class="chat-input" type="text" placeholder="Type your message...">
                <button class="chat-send-btn">
                    <span class="send-icon">↑</span>
                </button>
            </div>
        </div>
    </div>
</body>
</html>
