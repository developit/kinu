<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
    <title>UI Toolkit Demo</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 0;
        background: hsl(var(--k-background));
        color: hsl(var(--k-foreground));
      }
    </style>
    <script>
      // Apply the theme customizer's typeface choice before first paint.
      // Default = serif; user can opt to sans via the customizer.
      try {
        var s = localStorage.getItem('kinu-custom-theme-settings');
        var t = s ? (JSON.parse(s).typeface || 'serif') : 'serif';
        if (t === 'serif') document.documentElement.classList.add('theme-serif');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" prerender src="/src/main.tsx"></script>
  </body>
</html>
