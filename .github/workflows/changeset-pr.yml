name: Changeset PR Check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changeset:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          # `changeset status` diffs against the base branch, which isn't in the
          # default shallow clone.
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          filter: kinu
      # Only verifies a changeset is present — it exits non-zero when one is
      # missing. Versioning belongs to release.yml on main: running
      # changesets/action here consumed the changeset, then failed pushing a
      # changeset-release branch, which a read-only PR check can't do.
      - name: Verify a changeset is present
        run: pnpm exec changeset status --since=origin/${{ github.base_ref }}
