name: Compressed Size

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - uses: preactjs/compressed-size-action@v2
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          build-script: 'build'
          comment-key: 'dist'
          pattern: 'dist/**/*.{js,css}'
      - uses: preactjs/compressed-size-action@v2
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          build-script: 'bench:size'
          comment-key: 'bench-size'
          pattern: 'benchmarks/size/.tmp/**/*.{js,css}'
